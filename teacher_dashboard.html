<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헤일리 학원 · 통합 결과</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f4f6fa;color:#16202f;padding:24px 24px 60px;max-width:1200px;margin:0 auto}
.head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.head h1{font-size:20px;font-weight:800}
.sp{margin-left:auto}
.btn{border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.p{background:#13233f;color:#fff}
.btn.g{background:#eef1f6;color:#13233f}
.btn.k{background:#fae100;color:#3a2c00}
.btn.ac{background:#e8f0ff;color:#1a3fa0}
.btn.red{background:#fdf3f2;color:#c0392b}
.btn:disabled{opacity:.4;cursor:default}
.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(19,35,63,.05)}
.login{max-width:380px;margin:60px auto 0;text-align:center}
.login h1{font-size:22px;margin-bottom:6px}
.login p{color:#6c7a90;font-size:14px;margin-bottom:20px}
input{width:100%;border:1.5px solid #dde3ec;border-radius:10px;padding:13px 14px;font-size:16px;font-family:inherit;outline:none;margin-bottom:10px}
input:focus{border-color:#2b4f82}
.back{background:#eef1f6;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:#13233f}
.tag{font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 8px}
.tag.gram{background:#eef6ff;color:#2b6cb0}
.tag.voca{background:#eafaf3;color:#0f7a56}
.tag.read{background:#fef3e7;color:#9a5b1e}
.tag.mock{background:#f0eefe;color:#5b4bb0}
.tag.write{background:#fdf2ff;color:#7b2fa0}
.subtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.isretry{border-color:#f1b6b6;background:#fdf3f2}
.empty{text-align:center;color:#6c7a90;padding:40px 0}
.spin{text-align:center;color:#6c7a90;padding:30px 0}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#13233f;color:#fff;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.note{font-size:12px;color:#9aa6b8;margin-top:4px;line-height:1.5}
.warnbox{background:#fff;border:1px solid #f1b6b6;color:#b3261e}
/* 캘린더 */
.cal{background:#fff;border:1px solid #e2e7ef;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(19,35,63,.05);margin-bottom:14px}
.cal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid #f0f3f8}
.cal-head h2{font-size:17px;font-weight:800}
.cal-nav{display:flex;gap:6px;margin-left:auto}
.cal-nav button{background:#eef1f6;border:none;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;font-weight:700;color:#13233f}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:18px 16px}
.cal-dow{text-align:center;font-size:14px;font-weight:700;color:#9aa6b8;padding:6px 0}
.cal-day{text-align:center;padding:4px 2px;font-size:14px;color:#6c7a90;cursor:pointer;border-radius:10px;position:relative;min-height:90px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal-day:hover{background:#f4f6fa}
.cal-day.cur-month{color:#16202f}
.cal-day.today .cal-num{background:#13233f;color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.cal-day.selected .cal-num{background:#2b4f82;color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.cal-num{font-size:16px;font-weight:500;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.cal-dots{display:flex;gap:3px;justify-content:center;min-height:7px}
.cal-dot{width:6px;height:6px;border-radius:50%}
.cal-dot.ok{background:#1d9e75}
.cal-dot.retry{background:#c0392b}
.cal-legend{display:flex;gap:14px;padding:10px 16px;border-top:1px solid #f0f3f8;font-size:12px;color:#6c7a90}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* 날짜별 학생 목록 */
.day-panel{background:#fff;border:1px solid #e2e7ef;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(19,35,63,.05)}
.day-panel-head{padding:12px 16px;border-bottom:1px solid #f0f3f8;display:flex;align-items:center;gap:8px}
.day-panel-head h3{font-size:15px;font-weight:800}
.class-header{font-size:11px;font-weight:800;color:#9aa6b8;padding:8px 16px 4px;background:#f8fafc;border-bottom:1px solid #f0f3f8;letter-spacing:.04em}
.stud-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f3f8;cursor:pointer}
.stud-row:hover{background:#f8fafc}
.stud-row:last-child{border-bottom:none}
.stud-nm{font-size:15px;font-weight:700}
.stud-meta{font-size:12px;color:#6c7a90;margin-top:2px}
.check-badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:#e67e22;border-radius:999px;padding:2px 9px;margin-left:6px}
/* 상세 */
.secth{font-size:14px;font-weight:800;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.secth .dot{width:8px;height:8px;border-radius:50%}
.dot.gram{background:#2b6cb0}.dot.voca{background:#0f7a56}.dot.read{background:#9a5b1e}.dot.mock{background:#5b4bb0}.dot.write{background:#7b2fa0}
.line{font-size:14px;line-height:1.65;color:#2a3548}
.wrong{margin-top:6px;padding:10px 12px;background:#fbeae6;border-left:3px solid #c0492f;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.6;color:#7a2415;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.wrong b{color:#c0492f}
.subbox{border:1px solid #e2e7ef;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.writebox{border:1px solid #e8d8f5;border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fdf8ff}
.comment-box{background:#fff8e1;border:1px solid #f0c060;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#7a5500;line-height:1.6}
/* 학생관리 */
.mgmt-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f3f8;background:#fff}
.mgmt-row:last-child{border-bottom:none}
.mgmt-nm{font-size:14px;font-weight:700;flex:1}
.mgmt-nm.hidden-student{color:#ccd4e0;text-decoration:line-through}
.class-input{border:1.5px solid #2b4f82;border-radius:8px;padding:5px 10px;font-size:13px;width:80px;outline:none;font-family:inherit}
.del-btn{background:none;border:none;font-size:18px;cursor:pointer;color:#ccd4e0;padding:2px 6px;border-radius:6px}
.del-btn:hover{color:#c0392b;background:#fdf3f2}
.del-btn.restore{color:#1d9e75}
.del-btn.restore:hover{color:#0f7a56;background:#eafaf3}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const TEACHER_PW='haileyaca1@';
const APPS={
  gram:{name:'문법',url:'https://script.google.com/macros/s/AKfycbzUm4lQkMtuqIW2AdHkRVOf8dGHieKKq4Rg8ar1LsL-jD4YRTr8AnngbXkMboStGrjQ/exec'},
  voca:{name:'보카',url:'https://script.google.com/macros/s/AKfycbxmAKVf0x4D3WfQAkepaWvnYODrpbtKpQxCjtBc8mpXz0sFe6Wzroed6PSmHGse4Tj03Q/exec'},
  read:{name:'리딩',url:'https://script.google.com/macros/s/AKfycbxwNlGpJiUVXGMzWoJwxZhVjarVKLPNaQ79N3L9q8C7AxfeDsTYSSuW2JSh7TYlbKLfZg/exec'},
  mock:{name:'모의고사',url:'https://script.google.com/macros/s/AKfycbwa7ux4l63hTDqNUYPlUZ4xanz-VaxSNpJAEuvSHNewQz3sHge-YHnk7qM1ESar7CvM/exec'},
  write:{name:'영작',url:'https://script.google.com/macros/s/AKfycby9noStsKjGmYPEw5zQvopZA6wDVO0fWA60aVEqzlsvyaaivx6-Bx8FLfxW9V1G2moI2g/exec'},
};
const ACADEMY='헤일리 학원';
const RETRY_COMMENTS={
  gram:'문법 재시험이 있었습니다. 시간을 들여 충분히 공부하기 바랍니다.',
  voca:'단어 재시험이 있었습니다. 시간을 들여 충분히 공부하기 바랍니다.',
  read:'리딩 재시험이 있었습니다. 시간을 들여 충분히 공부하기 바랍니다.',
  mock:'모의고사 재시험이 있었습니다. 충분히 공부 후 시험보세요.',
  write:'영작 재시험이 있었습니다. 시간을 들여 충분히 공부하기 바랍니다.',
};
const CONSULT_COMMENT='이번 달 누적 재시험 5회 이상입니다. 다음 시간에 원장 선생님과 상담이 있습니다.';

let SCREEN='login', LOADING=false;
let RECORDS=[], ERRORS=[];
let CAL_YEAR=new Date().getFullYear(), CAL_MONTH=new Date().getMonth();
let SEL_DAY=null;
let CUR=null;
let CLASS_MAP=JSON.parse(localStorage.getItem('hailey_classes')||'{}');
let HIDDEN_SET=new Set(JSON.parse(localStorage.getItem('hailey_hidden')||'[]'));

const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2200)}
function mw(s){return s?String(s).split(',').map(x=>x.trim()).filter(Boolean):[]}
function nameKey(nm){return String(nm||'').replace(/\s+/g,'').toLowerCase()}

function parseDate(s){
  if(s==null)return null;
  if(typeof s==='number'||/^\d{10,}$/.test(String(s))){const d=new Date(Number(s));if(!isNaN(d))return mk(d);}
  const str=String(s).trim();
  let d=new Date(str);
  if(!isNaN(d)&&!/^\d{4}\.\s*\d/.test(str))return mk(d);
  const m=str.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.?\s*(오전|오후)?\s*(\d{1,2})?:?(\d{2})?/);
  if(m){let h=m[5]?parseInt(m[5]):0;const min=m[6]?parseInt(m[6]):0;if(m[4]==='오후'&&h<12)h+=12;if(m[4]==='오전'&&h===12)h=0;d=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]),h,min);if(!isNaN(d))return mk(d);}
  return null;
  function mk(d){return{ts:d.getTime(),dayKey:d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),label:d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일'}}
}
function fetchJSON(url){return fetch(url,{cache:'no-store'}).then(r=>r.json())}
function dayParam(off){const d=new Date();d.setDate(d.getDate()-off);return(d.getMonth()+1)+'/'+d.getDate()}

async function loadAll(){
  LOADING=true;ERRORS=[];RECORDS=[];render();
  const jobs=[];
  jobs.push(fetchJSON(APPS.gram.url+'?action=allResults').then(j=>{
    let list=[];
    if(Array.isArray(j))list=j;
    else if(j&&Array.isArray(j.list))list=j.list;
    else if(j&&Array.isArray(j.results))list=j.results;
    else if(j&&Array.isArray(j.data))list=j.data;
    list.forEach(r=>{const dt=parseDate(r.ts||r.date||r.time||r.timestamp||r.createdAt);if(!dt)return;RECORDS.push({subject:'gram',name:r.name||r.username||r.student,idkey:(r.username||r.name||'').toLowerCase(),dateStr:dt.label,dayKey:dt.dayKey,ts:dt.ts,detail:r});});
  }).catch(()=>ERRORS.push('문법')));
  const vocaSeen=new Set();
  ['중등부','고등부'].forEach(div=>{
    jobs.push(fetchJSON(APPS.voca.url+'?action=getResults&division='+encodeURIComponent(div)).then(arr=>{
      (arr||[]).forEach(r=>{const dt=parseDate(r.date);if(!dt)return;const dk=(r.name||'')+'|'+(r.id||'')+'|'+(r.unit||'')+'|'+dt.ts;if(vocaSeen.has(dk))return;vocaSeen.add(dk);RECORDS.push({subject:'voca',name:r.name,idkey:(r.id||r.name||'').toLowerCase(),dateStr:dt.label,dayKey:dt.dayKey,ts:dt.ts,detail:r});});
    }).catch(()=>{if(!ERRORS.includes('보카'))ERRORS.push('보카')}));
  });
  jobs.push(fetchJSON(APPS.read.url+'?action=getResults').then(arr=>{
    (arr||[]).forEach(r=>{const dt=parseDate(r.date);if(!dt)return;RECORDS.push({subject:'read',name:r.name,idkey:(r.id||r.name||'').toLowerCase(),dateStr:dt.label,dayKey:dt.dayKey,ts:dt.ts,detail:r});});
  }).catch(()=>ERRORS.push('리딩')));
  jobs.push(fetchJSON(APPS.mock.url).then(arr=>{
    (arr||[]).forEach(r=>{const dt=parseDate(r.time);if(!dt)return;RECORDS.push({subject:'mock',name:r.student,idkey:(r.id||r.student||'').toLowerCase(),dateStr:dt.label,dayKey:dt.dayKey,ts:dt.ts,detail:r});});
  }).catch(()=>ERRORS.push('모의고사')));
  const wf=Array.from({length:7},(_,i)=>dayParam(i));
  wf.forEach(day=>{
    jobs.push(fetchJSON(APPS.write.url+'?action=day&day='+encodeURIComponent(day)).then(j=>{
      if(!j||!j.ok)return;
      const sessions=j.sessions||j.rows||j.data||[];
      sessions.forEach(r=>{const dt=parseDate(r.at||r.startAt);if(!dt)return;const name=r.name||r.studentId||'';RECORDS.push({subject:'write',name,idkey:(r.studentId||name||'').toLowerCase(),dateStr:dt.label,dayKey:dt.dayKey,ts:dt.ts,detail:r});});
    }).catch(()=>{}));
  });
  await Promise.all(jobs);
  LOADING=false;render();
}

function isHidden(name){return HIDDEN_SET.has(nameKey(name))}
function isRetryRecord(r){
  const d=r.detail||{};
  if(r.subject==='gram')return(Number(d.round)||1)>=2;
  if(r.subject==='read')return String(d.retry||'').toUpperCase()==='Y';
  if(r.subject==='mock')return Number(d.retries)>0;
  if(r.subject==='voca'){const w1=mw(d.s1wrong).length,w2=mw(d.s2wrong).length;return w1>=4||w2>=4;}
  if(r.subject==='write'){const words=d.words||[];return words.filter(w=>w.ok===false||w.ok==='false'||w.ok===0).length>=3;}
  return false;
}
function monthKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)}
function personKey(r){const nm=String(r.name||'').replace(/\s+/g,'').trim();return nm?'nm:'+nm:'id:'+(r.idkey||'').trim()}
function monthlyRetryCount(pkey,ts){
  const mk=monthKey(ts);let n=0;
  RECORDS.forEach(r=>{if(personKey(r)!==pkey)return;if(monthKey(r.ts)!==mk)return;if(isRetryRecord(r))n++;});
  return n;
}
function classOf(name){return CLASS_MAP[nameKey(name)]||''}

function groupsByDay(dayKey){
  const recs=RECORDS.filter(r=>r.dayKey===dayKey&&!isHidden(r.name));
  const groups={};
  recs.forEach(r=>{
    const k=personKey(r);
    if(!groups[k])groups[k]={name:r.name,pkey:k,dayKey:r.dayKey,dateStr:r.dateStr,ts:r.ts,subs:new Set(),recs:[]};
    const g=groups[k];g.subs.add(r.subject);g.recs.push(r);if(r.ts>g.ts)g.ts=r.ts;
  });
  return Object.values(groups).map(g=>{
    g.hasRetry=g.recs.some(isRetryRecord);
    g.monthRetry=monthlyRetryCount(g.pkey,g.ts);
    g.cls=classOf(g.name);
    return g;
  }).sort((a,b)=>{const ca=a.cls||'zzz',cb=b.cls||'zzz';return ca<cb?-1:ca>cb?1:0;});
}

function calDayData(){
  const map={};
  RECORDS.filter(r=>!isHidden(r.name)).forEach(r=>{
    if(!map[r.dayKey])map[r.dayKey]={count:0,hasRetry:false};
    map[r.dayKey].count++;
    if(isRetryRecord(r))map[r.dayKey].hasRetry=true;
  });
  return map;
}

// 반별 과목 수 비교 → 확인 필요 여부
function needsCheck(group, byClassGroups){
  const cls=group.cls;
  if(!cls)return false;
  const peers=byClassGroups[cls]||[];
  if(peers.length<=1)return false;
  const maxSubs=Math.max(...peers.map(g=>g.subs.size));
  return group.subs.size<maxSubs;
}

// 상세 함수들
function detailGram(r){
  const d=r.detail;
  const isLT=String(d.chapterTitle||'')==='레벨 테스트'||String(d.levelTitle||'').includes('레벨');
  const unit=String(d.unit||'').replace(/—.*$/,'').trim()||d.chapterTitle||'';
  const title=(d.chapterTitle||'')+(unit?' › '+unit:'')+(d.round?' · '+d.round+'회차':'');
  const lines=['정답 '+d.correct+'/'+d.total+' ('+d.score+'점)'+(d.passed?' · 통과':' · 미통과')];
  const wrongs=[];
  if(isLT){const cc={};(d.wrongList||[]).forEach(w=>{const ch=w.chapterTitle||w.area||'기타';cc[ch]=(cc[ch]||0)+1;});const chaps=Object.keys(cc).sort((a,b)=>cc[b]-cc[a]);if(chaps.length){lines.push('약한 영역:');chaps.forEach(ch=>lines.push('  · '+ch+' '+cc[ch]+'개'));}}
  (d.wrongList||[]).forEach(w=>{const stem=String(w.q||'').replace(/\[\/?U\]/g,'').trim();const ct=isLT&&w.chapterTitle?'['+w.chapterTitle+'] ':'';wrongs.push(ct+stem);if(w.type==='mc'&&w.choices)(w.choices||[]).forEach((c,i)=>wrongs.push('   '+(i+1)+') '+String(c).replace(/\[\/?U\]/g,'')));});
  return{title,lines,wrongs};
}
function detailVoca(r){
  const d=r.detail||{};
  const title='단어 · '+(d.unit||'');
  const pw=n=>{const ks=['s'+n+'wrong','S'+n+'wrong','stage'+n+'wrong','wrong'+n];for(const k of ks){if(d[k]!=null&&String(d[k]).trim()!=='')return d[k];}return '';};
  const ps=n=>{const ks=['s'+n+'score','S'+n+'score','stage'+n+'score'];for(const k of ks){if(d[k]!=null&&String(d[k]).trim()!=='')return d[k];}return null;};
  const lines=[];let tot=0;
  [1,2,3,4].forEach(n=>{const sc=ps(n);const w=mw(pw(n));if(sc==null&&!w.length)return;if(sc!=null)tot+=Number(sc)||0;let line=(['Stage 1','Stage 2','Stage 3','Stage 4'][n-1])+(sc!=null?' · '+sc+'점':'');if(w.length)line+=' · 오답 '+w.length+'개: '+w.join(', ');lines.push(line);});
  lines.unshift('총 '+tot+'점');
  return{title,lines,wrongs:[]};
}
function detailRead(r){
  const d=r.detail;
  const ST={1:'1단계 문장(한국어)',2:'2단계 문장(영어)',3:'3-1 단어객관식',4:'4-1 빈칸객관식',5:'4-2 빈칸주관식',6:'3-2 단어주관식'};
  const title=(d.book||'')+(d.unit?' · '+d.unit:'');
  const sname=ST[Number(d.stage)]||('단계 '+d.stage);
  const wrongN=(Number(d.total)||0)-(Number(d.score)||0);
  const lines=[sname+': '+d.score+'/'+d.total+' · 오답 '+wrongN+'개'];
  const wrongs=[];
  const c=d.wrongContent;
  if(c){if(String(c).includes('|||')){String(c).split('///').forEach(p=>{const[a,b]=p.split('|||').map(x=>x.trim());if(a||b){wrongs.push('[틀린 것] '+(a||''));if(b)wrongs.push('   '+b);}});}else{mw(c).forEach(w=>wrongs.push('[틀린 것] '+w));}}
  return{title,lines,wrongs};
}
function detailWrite(r){
  const d=r.detail||{};
  const title='영작 · '+(d.setName||d.room||'');
  const words=d.words||[];
  const okN=words.filter(w=>w.ok===true||w.ok==='true'||w.ok===1).length;
  const total=words.length;
  const lines=[total?'정답 '+okN+'/'+total:'세션 완료'];
  if(d.right!=null&&d.total!=null)lines[0]='정답 '+d.right+'/'+d.total;
  const wrongs=[];
  words.forEach(w=>{if(w.ok===false||w.ok==='false'||w.ok===0){wrongs.push((w.no||'')+(w.word?' ['+w.word+']':'')+' '+String(w.text||''));if(w.fix)wrongs.push('   → '+w.fix+(w.why?' ('+w.why+')':''));}});
  return{title,lines,wrongs};
}

function subjectBlockHTML(subject,recs){
  const nm=APPS[subject].name;
  let h=`<div class="secth"><span class="dot ${subject}"></span>${nm}</div>`;
  if(subject==='mock'){recs.sort((a,b)=>a.ts-b.ts).forEach(r=>{h+=`<div class="subbox"><div class="line" style="white-space:pre-wrap">${esc(String(r.detail.summary||''))}</div></div>`;});return h;}
  if(subject==='write'){recs.sort((a,b)=>a.ts-b.ts).forEach(r=>{const x=detailWrite(r);h+=`<div class="writebox"><div class="line"><b>${esc(x.title)}</b></div>`;x.lines.forEach(l=>h+=`<div class="line">${esc(l)}</div>`);if(x.wrongs.length)h+=`<div class="wrong"><b>틀린 영작</b><br>`+x.wrongs.map(w=>esc(w)).join('<br>')+`</div>`;h+=`</div>`;});return h;}
  const fn=subject==='gram'?detailGram:subject==='voca'?detailVoca:detailRead;
  recs.sort((a,b)=>a.ts-b.ts).forEach(r=>{const x=fn(r);h+=`<div class="subbox"><div class="line"><b>${esc(x.title)}</b></div>`;x.lines.forEach(l=>h+=`<div class="line">${esc(l)}</div>`);if(x.wrongs.length)h+=`<div class="wrong"><b>틀린 것</b><br>`+x.wrongs.map(w=>esc(w)).join('<br>')+`</div>`;h+=`</div>`;});
  return h;
}

function buildKakao(group){
  const recs=group.recs;
  const L=[`[${ACADEMY}] ${group.name} · ${group.dateStr} 테스트결과`,'━━━━━━━━━━━━'];
  const retrySubs=[...new Set(recs.filter(isRetryRecord).map(r=>r.subject))];
  if(retrySubs.length){
    L.push('');
    retrySubs.forEach(sub=>{if(RETRY_COMMENTS[sub])L.push('※ '+RETRY_COMMENTS[sub]);});
    if(group.monthRetry>=5)L.push('※ '+CONSULT_COMMENT);
  }
  ['read','voca','gram','mock','write'].forEach(sub=>{
    const rs=recs.filter(r=>r.subject===sub);if(!rs.length)return;
    L.push('');L.push('■ '+APPS[sub].name);
    if(sub==='mock'){rs.sort((a,b)=>a.ts-b.ts).forEach(r=>{L.push(String(r.detail.summary||'').trim());});return;}
    if(sub==='write'){rs.sort((a,b)=>a.ts-b.ts).forEach(r=>{const x=detailWrite(r);L.push('· '+x.title);x.lines.forEach(l=>L.push('  '+l));if(x.wrongs.length)x.wrongs.forEach(w=>L.push('  '+w));});return;}
    if(sub==='read'){const grps={};rs.forEach(r=>{const d=r.detail||{};const k=(d.book||'')+'|'+(d.unit||'');(grps[k]=grps[k]||[]).push(r);});Object.keys(grps).forEach(k=>{const[book,unit]=k.split('|');const hdr=[book,unit].filter(Boolean).join(' · ');if(hdr)L.push('· '+hdr);const ord={1:1,2:2,3:3,6:4,4:5,5:6};grps[k].sort((a,b)=>(ord[a.detail.stage]||9)-(ord[b.detail.stage]||9)).forEach(r=>{const x=detailRead(r);x.lines.forEach(l=>L.push('  '+l));if(x.wrongs.length)x.wrongs.forEach(w=>L.push('    '+w));});});return;}
    const fn=sub==='gram'?detailGram:detailVoca;
    rs.sort((a,b)=>a.ts-b.ts).forEach(r=>{const x=fn(r);L.push('· '+x.title);x.lines.forEach(l=>L.push('  '+l));if(x.wrongs.length)x.wrongs.forEach(w=>L.push('  '+w));});
  });
  return L.join('\n');
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('카톡에 붙여넣으세요')).catch(()=>fb(t));}else fb(t);
  function fb(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('카톡에 붙여넣으세요')}catch(e){toast('복사 실패')}ta.remove();}
}

let _glist=[];
function GIDX(g){const i=_glist.indexOf(g);if(i>=0)return i;_glist.push(g);return _glist.length-1}
function openStudent(i){CUR=_glist[i];SCREEN='detail';render()}
function copyCur(){if(CUR)copyText(buildKakao(CUR))}

function render(){
  const root=$('root');
  if(SCREEN==='login'){
    root.innerHTML=`<div class="login"><h1>${ACADEMY}</h1><p>통합 결과 · 선생님 전용</p>
      <input type="password" id="pw" placeholder="선생님 비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn p" style="width:100%;padding:15px;font-size:16px" onclick="doLogin()">들어가기</button>
      <div class="note" style="margin-top:14px">리딩·보카·문법·모의고사·영작 결과를 한 곳에서 봅니다.</div></div>`;
    setTimeout(()=>{const p=$('pw');p&&p.focus()},80);return;
  }
  if(SCREEN==='cal'){
    _glist=[];
    if(LOADING){root.innerHTML=headHTML()+`<div class="spin">불러오는 중…</div>`;return;}
    const calData=calDayData();
    root.innerHTML=headHTML()+renderCal(calData)+renderDayPanel();
    return;
  }
  if(SCREEN==='detail'&&CUR){
    const g=CUR;
    const retrySubs=[...new Set(g.recs.filter(isRetryRecord).map(r=>r.subject))];
    const commentLines=retrySubs.map(sub=>RETRY_COMMENTS[sub]).filter(Boolean);
    if(g.monthRetry>=5)commentLines.push(CONSULT_COMMENT);
    let h=`<div class="head"><button class="back" onclick="SCREEN='cal';render()">‹ 캘린더</button>
      <h1 style="font-size:18px;margin-left:6px">${esc(g.name)}</h1></div>
      <div style="color:#6c7a90;font-size:13px;margin:0 2px 12px">${g.dateStr}${g.cls?' · '+g.cls:''}</div>
      ${g.hasRetry?`<div class="card isretry" style="margin-bottom:8px;color:#c0392b;font-weight:700">⭐ 재시험 본 학생 · 이번 달 누적 ${g.monthRetry}회</div>`:''}
      ${commentLines.length?`<div class="comment-box">💬 ${commentLines.map(esc).join('<br>')}</div>`:''}
      <button class="btn k" style="width:100%;padding:13px;margin-bottom:14px" onclick="copyCur()">이 학생 · 이 날 전체 카톡 복사</button>`;
    ['read','voca','gram','mock','write'].forEach(sub=>{const rs=g.recs.filter(r=>r.subject===sub);if(rs.length)h+=subjectBlockHTML(sub,rs);});
    root.innerHTML=h;return;
  }
  if(SCREEN==='mgmt'){renderMgmt();return;}
}

function headHTML(){
  return `<div class="head"><h1>통합 결과</h1><div class="sp"></div>
    <button class="btn ac" onclick="SCREEN='mgmt';render()">학생관리</button>
    <button class="btn g" onclick="loadAll()">새로고침</button>
  </div>`;
}

function renderCal(calData){
  const now=new Date();
  const y=CAL_YEAR,m=CAL_MONTH;
  const first=new Date(y,m,1).getDay();
  const last=new Date(y,m+1,0).getDate();
  const todayKey=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  let h=`<div class="cal"><div class="cal-head"><h2>${y}년 ${months[m]}</h2>
    <div class="cal-nav"><button onclick="prevMonth()">‹</button><button onclick="nextMonth()">›</button></div></div>
    <div class="cal-grid">
    <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div><div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>`;
  for(let i=0;i<first;i++)h+=`<div class="cal-day"></div>`;
  for(let d=1;d<=last;d++){
    const dk=y+'-'+(m+1)+'-'+d;
    const isToday=dk===todayKey;
    const isSel=SEL_DAY===dk;
    const data=calData[dk];
    let cls='cal-day cur-month';
    if(isToday)cls+=' today';
    if(isSel)cls+=' selected';
    let dots='';
    if(data){dots=`<div class="cal-dots">${data.hasRetry?'<div class="cal-dot retry"></div>':'<div class="cal-dot ok"></div>'}</div>`;}
    h+=`<div class="${cls}" onclick="selectDay('${dk}')"><div class="cal-num">${d}</div>${dots}</div>`;
  }
  h+=`</div><div class="cal-legend"><span><i style="background:#1d9e75"></i>결과 있음</span><span><i style="background:#c0392b"></i>재시험 있음</span></div></div>`;
  return h;
}

function renderDayPanel(){
  if(!SEL_DAY)return`<div class="empty" style="margin-top:20px">날짜를 선택하면 학생 목록이 나와요</div>`;
  const groups=groupsByDay(SEL_DAY);
  if(!groups.length)return`<div class="empty" style="margin-top:20px">이 날 결과가 없어요</div>`;
  const dateStr=groups[0]?.dateStr||SEL_DAY;
  // 반별 묶기
  const byClass={};
  groups.forEach(g=>{const c=g.cls||'__none__';(byClass[c]=byClass[c]||[]).push(g);});
  let h=`<div class="day-panel"><div class="day-panel-head"><h3>${dateStr} · ${groups.length}명</h3></div>`;
  const sortedClasses=Object.keys(byClass).sort((a,b)=>a==='__none__'?1:b==='__none__'?-1:a<b?-1:1);
  sortedClasses.forEach(cls=>{
    const label=cls==='__none__'?'미배정':cls;
    h+=`<div class="class-header">${esc(label)} · ${byClass[cls].length}명</div>`;
    byClass[cls].forEach(g=>{
      const idx=GIDX(g);
      const subs=[...g.subs];
      const tags=subs.map(s=>`<span class="tag ${s}">${APPS[s].name}</span>`).join('');
      const red=g.hasRetry;
      const chk=needsCheck(g,byClass);
      h+=`<div class="stud-row ${red?'isretry':''}" onclick="openStudent(${idx})">
        <div style="flex:1">
          <div class="stud-nm" style="${red?'color:#c0392b':''}">
            ${esc(g.name)}${red?' ⭐':''}${chk?'<span class="check-badge">확인필요</span>':''}
          </div>
          <div class="stud-meta">${red?'재시험 · 이번 달 '+g.monthRetry+'회':subs.length+'과목 응시'}</div>
          <div class="subtags">${tags}</div>
        </div>
        <span style="color:#9aa6b8;font-size:18px">›</span>
      </div>`;
    });
  });
  h+=`</div>`;
  return h;
}

function renderMgmt(){
  const root=$('root');
  const names=new Set();
  RECORDS.forEach(r=>{if(r.name)names.add(String(r.name).trim());});
  const sorted=[...names].sort();
  const hiddenCount=sorted.filter(nm=>HIDDEN_SET.has(nameKey(nm))).length;
  let h=`<div class="head"><button class="back" onclick="SCREEN='cal';render()">‹ 캘린더</button>
    <h1 style="font-size:17px;margin-left:6px">학생관리</h1>
    <div class="sp"></div>
    <button class="btn p" onclick="saveMgmt()">저장</button></div>
  <div style="font-size:12px;color:#9aa6b8;margin-bottom:12px">반 배정·학생 삭제(숨기기)를 설정합니다. 이 기기에 저장됩니다.${hiddenCount?` · 숨긴 학생 ${hiddenCount}명`:''}</div>
  <div class="card" style="padding:0;overflow:hidden">`;
  sorted.forEach((nm,i)=>{
    const key=nameKey(nm);
    const cur=CLASS_MAP[key]||'';
    const hidden=HIDDEN_SET.has(key);
    h+=`<div class="mgmt-row">
      <div class="mgmt-nm ${hidden?'hidden-student':''}">${esc(nm)}</div>
      ${hidden
        ? `<span style="font-size:11px;color:#ccd4e0">숨김</span>
           <button class="del-btn restore" onclick="toggleHide('${key}',false)" title="복원">↩</button>`
        : `<input class="class-input" id="ci_${i}" value="${esc(cur)}" placeholder="예: 중1A">
           <button class="del-btn" onclick="toggleHide('${key}',true)" title="숨기기(삭제)">✕</button>`
      }
    </div>`;
  });
  h+=`</div>`;
  root.innerHTML=h;
}

function toggleHide(key,hide){
  // 현재 입력값 먼저 CLASS_MAP에 반영
  const names=new Set();
  RECORDS.forEach(r=>{if(r.name)names.add(String(r.name).trim());});
  [...names].sort().forEach((nm,i)=>{
    const k=nameKey(nm);
    const inp=$('ci_'+i);
    if(inp){const v=inp.value.trim();if(v)CLASS_MAP[k]=v;else delete CLASS_MAP[k];}
  });
  localStorage.setItem('hailey_classes',JSON.stringify(CLASS_MAP));
  if(hide){HIDDEN_SET.add(key);}else{HIDDEN_SET.delete(key);}
  localStorage.setItem('hailey_hidden',JSON.stringify([...HIDDEN_SET]));
  renderMgmt();
}

function saveMgmt(){
  const names=new Set();
  RECORDS.forEach(r=>{if(r.name)names.add(String(r.name).trim());});
  const sorted=[...names].sort();
  sorted.forEach((nm,i)=>{
    const key=nameKey(nm);
    const inp=$('ci_'+i);
    if(inp){const v=inp.value.trim();if(v)CLASS_MAP[key]=v;else delete CLASS_MAP[key];}
  });
  localStorage.setItem('hailey_classes',JSON.stringify(CLASS_MAP));
  toast('저장했어요!');
  SCREEN='cal';render();
}

function selectDay(dk){SEL_DAY=dk;render();}
function prevMonth(){CAL_MONTH--;if(CAL_MONTH<0){CAL_MONTH=11;CAL_YEAR--;}render();}
function nextMonth(){CAL_MONTH++;if(CAL_MONTH>11){CAL_MONTH=0;CAL_YEAR++;}render();}

function doLogin(){
  const v=($('pw').value||'').trim();
  if(v===TEACHER_PW){SCREEN='cal';render();loadAll();}
  else toast('비밀번호가 달라요');
}

render();
</script>
